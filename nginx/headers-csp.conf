# Same-origin only: no third-party script, style, font, image, frame or connection. 'wasm-unsafe-eval' lets the calculator compile its WebAssembly;
# inline styles are allowed (the app sets style attributes), inline script is not. scripts/test-install.mjs enforces this exact policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
