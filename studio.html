<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#090807"><link rel="icon" href="/icons/icon-192.png">
<title>Enoch · Studio</title></head>
<!-- The Studio: The Day (the app's #day view) as 9:16 video frames (src/studio/main.ts; scripts/day-video.mjs records it). Not linked from the app. -->
<body>
<div class="st-holder" id="holder">
 <div class="st-frame" id="frame">
  <div class="st-day" id="day"></div>
  <header class="st-head">
   <div class="st-mark"><b>ENOCH</b><span id="place"></span></div>
   <div class="st-row"><h1><span id="weekday"></span> <i>·</i> <span id="course"></span></h1><div class="st-clock" id="clock"></div></div>
   <div class="st-row st-sub"><span id="dates"></span><span id="daypart"></span></div>
  </header>
  <p class="st-status" id="status">Starting…</p>
 </div>
</div>
<div class="st-controls" id="controls">
 <button id="play" aria-label="Play">▶</button>
 <input id="scrub" type="range" min="0" value="0" aria-label="Frame">
 <span id="readout"></span>
</div>
<script type="module" src="/src/studio/main.ts"></script>
</body></html>
