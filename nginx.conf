# The instrument as a static site: every calculation runs in the browser (src/calculator), Deep Time is static files (/deep/),
# so nothing here proxies to a service. The same tree can be served by any static host that sets these headers.
# nginx drops inherited add_header lines in any location that sets its own, so every location includes the header snippets itself.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types application/json application/javascript application/wasm text/css image/svg+xml application/manifest+json font/ttf;

  # There is no API (calculations run in the browser): an old link or check gets a 404, never the app's HTML with a 200.
  location /api/ { return 404; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  # Worker, WASM and ephemeris: revalidated (ETag) on every use, never "immutable" — their names are not content-hashed. A missing file is a 404, never the app's HTML.
  location /calculator/ { try_files $uri =404; add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  # Deep Time's data files: names are not content-hashed, so revalidated; a missing file is a 404, never HTML.
  location /deep/ { try_files $uri =404; add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  # The licence and third-party notices (scripts/stage-legal.mjs): plain text, revalidated.
  location /legal/ { try_files $uri =404; charset utf-8; add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  location /film/ { try_files $uri =404; expires 30d; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  location /fonts/ { expires 30d; types { font/ttf ttf; } include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  location /icons/ { expires 30d; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  location /sky/ { expires 1d; types { application/json json; text/plain txt md; application/javascript js; } include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  # The service worker and the pack list are always revalidated, so a new build is noticed on the next visit.
  location = /sw.js { try_files $uri =404; add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  location = /offline-manifest.json { try_files $uri =404; add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  location = /manifest.webmanifest { try_files $uri =404; types { application/manifest+json webmanifest; } add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
  # Static explainer pages carry their own inline script and style and never reach the API, so they get the base headers without the CSP.
  location /primer/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; }
  location /phoenix/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; }
  location / { try_files $uri $uri/index.html /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/enoch/headers-base.conf; include /etc/nginx/enoch/headers-csp.conf; }
}
