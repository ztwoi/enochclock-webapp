<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#090807"><link rel="icon" href="/icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Enoch"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Enoch · The Book of the Courses of the Luminaries</title></head>
<body>
<div class="app" id="app">
 <header class="top">
  <div class="mark"><b>ENOCH</b><span lang="gez">መጽሐፈ ሚጠተ ብርሃናተ ሰማይ</span></div>
  <nav class="nav" aria-label="Views">
   <a href="#sky" data-view="sky" class="on" aria-current="page"><i>01</i>Sky</a>
   <a href="#dial" data-view="dial"><i>02</i>The Dial</a>
   <a href="#day" data-view="day"><i>03</i>The Day</a>
   <a href="#deep" data-view="deep"><i>04</i>Deep Time</a>
  </nav>
  <div class="spacer"></div>
  <button class="chip film-link" id="film-btn" title="Watch: the courses of the luminaries (3 min)">▶ Watch</button>
  <a class="chip primer-link" href="/tutorial/" title="Tutorial: how the Enoch clock works, and how to read it">Tutorial</a>
  <button class="chip" id="site-chip" aria-haspopup="dialog" aria-controls="site-dialog">—</button>
  <span class="chip" id="time-chip">TIME SCALE <b>UT</b></span>
  <button class="chip" id="calc-status" data-mode="server" title="Calculator and offline use" aria-label="Calculator and offline use"></button>
 </header>
 <section class="stage" id="stage" aria-busy="true">
  <div class="view-head">
   <h1 id="vh-title"></h1>
   <p id="vh-prim" hidden></p>
   <p class="quote" id="vh-quote"></p>
   <div class="opts" id="dial-controls" hidden>
    <div class="seg" role="group" aria-label="Framing"><button class="btn on" data-framing="north" aria-pressed="true" title="North at the top: the bearings fixed, the Sun's line on its true bearing">North-up</button><button class="btn" data-framing="sun" aria-pressed="false" title="The Sun's line always at the top: the world turns under it">Sun-up</button><button class="btn" data-framing="compass" aria-pressed="false" title="The top of the face is the way the device points (needs HTTPS on a phone)">Compass</button></div>
    <button class="btn on" id="dial-info" aria-pressed="true" title="The reading: the day, the date and the Sun, the counts and the Sun's line (off: the face alone)">Info</button>
   </div>
   <div class="opts" id="sky-controls" hidden>
    <div class="seg" role="group" aria-label="Turn the sky"><button class="btn on" data-facing="east" aria-pressed="true" aria-label="Turn to the east, where the Sun rises" title="Turn to the east: the six portals where the Sun rises, centred and level. Drag or swipe the sky to turn it all the way round.">East</button><button class="btn" data-facing="west" aria-pressed="false" aria-label="Turn to the west, where the Sun sets" title="Turn to the west: the six portals where the Sun sets, centred and level. Drag or swipe the sky to turn it all the way round.">West</button><button class="btn" data-facing="compass" aria-pressed="false" aria-label="Compass: the sky follows the way the device points" title="Compass: the sky follows the way the device points (needs your location, for true north). Touching the sky pauses it; tap again to follow, and again to stop.">Compass</button><button class="btn" data-facing="sun" aria-pressed="false" aria-label="Follow the Sun: the sky turns with it" title="Follow the Sun: the sky turns with it, opening out at midday and midnight so the horizon and the Sun are both in view. Zoom in first and it follows that close; pinch or scroll to zoom while it follows (double-tap: the whole view again). Dragging the sky, East, West or Compass stops it.">Sun</button></div>
    <label class="opt-sel" title="The faintest stars shown (visual magnitude)">V ≤ <select id="mag" aria-label="Star limit, visual magnitude"><option>4.5</option><option>5.5</option><option selected>6.5</option><option>7.5</option><option>8.5</option></select></label>
    <button class="btn on" id="refraction" aria-pressed="true" title="Altitudes as seen through the air; off: true altitudes">Refraction</button>
    <button class="btn on" id="figures" aria-pressed="true" title="Constellation figures">Figures</button>
    <button class="btn on" id="portal-stars" aria-pressed="true" aria-label="Portal stars" title="The stars at the portals">Portal ★</button>
    <button class="btn on" id="planets" aria-pressed="true" title="Mercury to Neptune, as on the Dial">Planets</button>
    <button class="btn on" id="daylight" aria-pressed="true" title="The sky lit by day and twilight. Off: a night sky at every hour">Daylight</button>
    <button class="btn" id="bearing" aria-pressed="false" title="Show the bearing at the middle of the view: a line and its degrees. Always shown while the compass leads, and for a moment while you turn the sky">Bearing</button>
    <button class="btn on" id="below" aria-pressed="true" title="Look under the horizon, down to the nadir (−90°)">Below horizon</button>
    <button class="btn" id="paths" aria-pressed="false" title="The day's paths, sunrise to sunrise: the Sun's (solid where it has been, dotted where it goes, a dot each part), the Moon's and each planet's, faint in its colour; the body the sky follows, drawn as the Sun's">Paths</button>
   </div>
   <div class="opts" id="day-controls" hidden>
    <button class="btn on" id="day-follow" aria-pressed="true" title="The sky turns with the Sun. Zoom in first and it follows that close; pinch or scroll to zoom while it follows (double-tap: the whole view again). Dragging the sky stops it; tap to follow again">Follow Sun</button>
    <button class="btn" id="day-daylight" aria-pressed="false" title="The sky lit by day and twilight. Off: a night sky at every hour, so the stars and planets by day show">Daylight</button>
    <button class="btn on" id="day-captions" aria-pressed="true" title="Each rising and setting named as the day reaches it">Captions</button>
   </div>
   <div class="opts" id="deep-controls" hidden>
    <div class="seg" role="group" aria-label="Zoom acts on"><button class="btn on" data-deep-axis="years" aria-pressed="true" title="− and + zoom the years">Years</button><button class="btn" data-deep-axis="days" aria-pressed="false" title="− and + zoom the day scale">Days</button></div>
    <button class="btn" data-deep-z="out" aria-label="Zoom out" title="Zoom out (−)">−</button><button class="btn" data-deep-z="in" aria-label="Zoom in" title="Zoom in (+)">+</button><button class="btn" data-deep-z="home" aria-label="Back to the starting view" title="Back to the starting view (0)">⟲</button>
   </div></div>
  <div class="view" id="view-deep"></div>
  <div class="view" id="view-sky"><p class="sky-note" id="sky-note" role="status" hidden></p><div class="sky-follow" id="sky-follow" role="group" aria-label="Follow a body" hidden></div><div class="sky-cal" id="sky-cal" role="dialog" aria-label="Calibrate the compass" hidden></div></div>
  <div class="view" id="view-dial"></div>
  <div class="view" id="view-day"></div>
  <button class="btn focus-btn" id="focus" hidden></button>
  <p class="status" id="status" role="status">Calculating the year…</p>
  <div class="foot"><span id="foot-a"></span><span id="foot-b"></span></div>
 </section>
 <aside class="inspector sheet" id="insp-wrap" aria-label="Inspector"><div class="sheet-bar" id="handle"><span class="grab"></span><span class="sheet-t">Details</span><button class="sheet-x" id="sheet-close" aria-label="Close details">✕</button></div><div class="sheet-ctl" id="sheet-ctl"><div class="opts sheet-opts" id="sky-sheet-opts" hidden></div></div><div id="insp"></div></aside>
 <footer class="transport">
  <div class="when-wrap"><div class="when" id="when"></div><svg id="cycle-track" viewBox="0 0 1000 24" preserveAspectRatio="none" aria-label="Current 294-year cycle"></svg></div>
  <div id="tp"></div>
  <div class="ctl" id="ctl">
   <button class="btn" id="year-prev" aria-label="Previous Enoch year">◀ yr</button>
   <button class="btn now" id="now" aria-pressed="false" title="Follow the present (N)">Now</button>
   <button class="btn" id="year-next" aria-label="Next Enoch year">yr ▶</button>
   <input class="goto" id="goto" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="go to date: 2026-10-20 · −500-03-21" aria-label="Go to a date (years before 1 CE: −500 = 501 BCE)" title="Any date from −12998 to 16995 (astronomical years: 0 = 1 BCE, −500 = 501 BCE)">
  </div>
  <button class="more" id="more" aria-expanded="false" aria-controls="insp-wrap" aria-label="Details">⋯</button>
 </footer>
 <dialog id="site-dialog" aria-label="Observer location">
  <form method="dialog" id="site-form">
   <h2>Observer</h2>
   <p class="sub" id="geo-note"></p>
   <button type="button" class="btn" id="use-device">Use this device's location</button>
   <div class="presets" id="presets"></div>
   <label>Latitude ° N <input name="lat" type="number" step="any" min="-90" max="90" required></label>
   <label>Longitude ° E <input name="lon" type="number" step="any" min="-180" max="180" required></label>
   <label>Elevation m <input name="elev" type="number" step="any" value="0"></label>
   <label>Time zone <input name="tz" type="text" required></label>
   <menu><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn on" id="site-apply" value="apply">Calculate</button></menu>
  </form>
 </dialog>
</div>
<script type="module" src="/src/main.ts"></script>
</body></html>
